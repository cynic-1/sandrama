<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SandDrama · 用户管理</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1f2937; background: #f5f7fb; }
    body { max-width: 1080px; margin: 0 auto; padding: 32px 20px; }
    .card { background: #fff; border-radius: 12px; padding: 22px; margin-bottom: 18px; box-shadow: 0 4px 18px #14213d12; }
    h1 { margin: 0 0 8px; } h2 { margin-top: 0; font-size: 18px; }
    .muted { color: #6b7280; font-size: 13px; }
    form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: end; }
    label { display: grid; gap: 6px; font-size: 13px; color: #4b5563; }
    input, select, button { box-sizing: border-box; width: 100%; min-height: 38px; border: 1px solid #d1d5db; border-radius: 7px; padding: 7px 10px; background: #fff; }
    button { cursor: pointer; border: 0; background: #2563eb; color: #fff; font-weight: 600; }
    button.danger { background: #dc2626; } button.secondary { background: #6b7280; }
    table { width: 100%; border-collapse: collapse; } th, td { padding: 11px 8px; text-align: left; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
    .actions { display: flex; gap: 7px; } .actions button { width: auto; min-height: 30px; }
    #message { min-height: 20px; margin-top: 10px; color: #2563eb; } .error { color: #dc2626 !important; }
    @media (max-width: 760px) { form { grid-template-columns: 1fr 1fr; } table { display: block; overflow-x: auto; white-space: nowrap; } }
  </style>
</head>
<body>
  <section class="card">
    <h1>用户管理</h1>
    <div class="muted">仅管理员可用。用户创建后可独立登录，项目数据按用户隔离。</div>
    <div id="message"></div>
  </section>
  <section class="card">
    <h2>创建用户</h2>
    <form id="createForm">
      <label>用户名<input name="name" required maxlength="64" /></label>
      <label>初始密码<input name="password" type="password" minlength="8" required /></label>
      <label>角色<select name="role"><option value="user">普通用户</option><option value="admin">管理员</option></select></label>
      <button type="submit">创建用户</button>
    </form>
  </section>
  <section class="card">
    <h2>用户列表</h2>
    <table><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>最后登录</th><th>操作</th></tr></thead><tbody id="users"></tbody></table>
  </section>
<script>
  const message = document.querySelector('#message');
  const users = document.querySelector('#users');
  const show = (text, error = false) => { message.textContent = text || ''; message.className = error ? 'error' : ''; };
  async function request(path, options = {}) {
    const response = await fetch(path, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || data.code >= 400) throw new Error(data.message || data.data || '请求失败');
    return data.data;
  }
  const date = value => value ? new Date(Number(value)).toLocaleString() : '从未登录';
  function row(user) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${user.id}</td><td>${escapeHtml(user.name)}</td><td>${user.role === 'admin' ? '管理员' : '普通用户'}</td><td>${user.disabled ? '已禁用' : '启用'}</td><td>${date(user.lastLoginAt)}</td><td class="actions"><button data-action="edit">编辑</button><button class="danger" data-action="delete">删除</button></td>`;
    tr.querySelector('[data-action=edit]').onclick = async () => {
      const name = prompt('用户名', user.name); if (name === null) return;
      const password = prompt('新密码（留空不修改，至少 8 位）', ''); if (password === null) return;
      const role = prompt('角色：admin 或 user', user.role || 'user'); if (role === null) return;
      const disabled = confirm('确定将该账号设为禁用吗？（取消即启用）');
      try { await request('/api/setting/userManagement/updateUser', { method: 'POST', body: JSON.stringify({ id: user.id, name, password: password || undefined, role, disabled }) }); show('更新成功'); await load(); } catch (e) { show(e.message, true); }
    };
    tr.querySelector('[data-action=delete]').onclick = async () => {
      if (!confirm(`确定删除用户“${user.name}”？其项目将转交当前管理员。`)) return;
      try { await request('/api/setting/userManagement/deleteUser', { method: 'POST', body: JSON.stringify({ id: user.id }) }); show('删除成功'); await load(); } catch (e) { show(e.message, true); }
    };
    return tr;
  }
  function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
  async function load() {
    try { const list = await request('/api/setting/userManagement/listUsers'); users.replaceChildren(...list.map(row)); }
    catch (e) { show(e.message, true); }
  }
  document.querySelector('#createForm').onsubmit = async event => {
    event.preventDefault();
    const formElement = event.currentTarget;
    const form = new FormData(formElement);
    try {
      await request('/api/setting/userManagement/createUser', { method: 'POST', body: JSON.stringify(Object.fromEntries(form)) });
      formElement.reset();
      show('创建成功');
      await load();
    } catch (e) { show(e.message, true); }
  };
  load();
</script>
</body>
</html>
